services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: VagaJusta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5090:5090"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5090
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=VagaJusta;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5090/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./Frontend/vaga-justa-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5090
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
